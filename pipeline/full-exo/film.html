<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EXO Film Preview</title>
<style>
  :root { --bg: #0d0e10; --ink: #e9e9ec; --dim: #8b8d93; --line: rgba(255,255,255,.12); }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden;
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; }
  #view { position: fixed; inset: 0; }
  .cap { position: fixed; left: 32px; bottom: 84px; pointer-events: none; transition: opacity .35s; }
  .cap .t { font-size: 22px; font-weight: 600; letter-spacing: -.01em; }
  .cap .s { color: var(--dim); margin-top: 2px; }
  .bar { position: fixed; left: 16px; right: 16px; bottom: 16px; display: flex; gap: 12px; align-items: center;
    background: rgba(20,21,24,.72); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; backdrop-filter: blur(10px); }
  button { all: unset; cursor: pointer; padding: 6px 10px; border-radius: 8px; color: var(--ink); }
  button:hover { background: rgba(255,255,255,.08); }
  input[type=range] { flex: 1; accent-color: #d0d2d6; }
  .tm { font-variant-numeric: tabular-nums; color: var(--dim); min-width: 64px; text-align: right; }
</style>
</head>
<body>
<div id="view"></div>
<div class="cap" id="cap"><div class="t" id="capT"></div><div class="s" id="capS"></div></div>
<div class="bar">
  <button id="play" aria-label="Pause">Pause</button>
  <input id="scrub" type="range" min="0" max="1" value="0" aria-label="Film position">
  <span class="tm" id="time">0.0 s</span>
  <button id="cam" aria-pressed="true">Film camera</button>
</div>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/" } }</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { loadBody, segmentTransforms } from './body.js';
const $ = id => document.getElementById(id); const bust = '?t=' + Date.now();
const FILM = await (await fetch((new URLSearchParams(location.search).get('film') || 'designs/film.json') + bust)).json();

const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.toneMapping = THREE.AgXToneMapping; $('view').appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0d0e10);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(renderer), 0.04).texture; scene.environmentIntensity = 0.55;
const key = new THREE.DirectionalLight(0xfff4ea, 2.2); key.position.set(-1.0, 1.6, 1.2); scene.add(key);
const rimA = new THREE.DirectionalLight(0xcfe2ff, 2.6); rimA.position.set(1.4, 0.9, -1.2); scene.add(rimA);   // cool rims outline the black body
const rimB = new THREE.DirectionalLight(0xcfe2ff, 1.6); rimB.position.set(-1.6, 0.4, -1.0); scene.add(rimB);
const camera = new THREE.PerspectiveCamera(28, 1, 0.01, 30);
const controls = new OrbitControls(camera, renderer.domElement); controls.enableDamping = true;
function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

// ---- mannequin: the film's own mesh (mannequin.py -> mannequin_head.json, exactly what film_frames.py sends to
// Blender): the rig's skin below the lower neck + a smooth featureless display head and neck, matte black
const ANA = await loadBody(THREE, 'body_mesh.json'); scene.add(ANA.group); const L = ANA.landmarks;
const black = new THREE.MeshPhysicalMaterial({ color: 0x050506, roughness: 0.9, metalness: 0, specularIntensity: 0.45, envMapIntensity: 0.35 });
ANA.group.traverse(o => { if (o.isMesh) o.visible = false; });                  // rig meshes hidden (eyes too); the mannequin below
const skin = ANA._dbg.dynamic.find(d => d.cls === 'skin').mesh; skin.material = new THREE.MeshBasicMaterial({ visible: false });
const MQ = await (await fetch('mannequin_head.json' + bust)).json();
const dec = (str, T) => { const b = atob(str), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return new T(u.buffer); };
const mq = (() => {
  const nb = MQ.nb, np_ = MQ.npv, keep = dec(MQ.keep, Uint8Array), pv = dec(MQ.pv, Float32Array), wi = dec(MQ.wi, Uint32Array), ww = dec(MQ.ww, Float32Array);
  const I0 = skin.geometry.index.array, idx = [];
  if (I0.length !== 3 * MQ.nf) throw new Error('mannequin_head.json does not match body_mesh.json (rebuild: python3 mannequin.py)');
  for (let f = 0; f < MQ.nf; f++) if ((keep[f >> 3] >> (7 - (f & 7))) & 1) idx.push(I0[3 * f], I0[3 * f + 1], I0[3 * f + 2]);
  for (const k of dec(MQ.pf, Uint32Array)) idx.push(k);
  const pos = new Float32Array(3 * (nb + np_)), g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setIndex(new THREE.BufferAttribute(Uint32Array.from(idx), 1));
  const mesh = new THREE.Mesh(g, black); mesh.frustumCulled = false; mesh.matrixAutoUpdate = false; ANA.group.add(mesh);
  return { apply() {                                                             // new vertex = rest + blend of its rig vertices' displacement
    const P = skin.geometry.attributes.position.array, R0 = skin.geometry.attributes.restPos.array; pos.set(P, 0);
    for (let i = 0; i < np_; i++) { let x = pv[3 * i], y = pv[3 * i + 1], z = pv[3 * i + 2];
      for (let k = 0; k < 4; k++) { const j = 3 * wi[4 * i + k], w = ww[4 * i + k]; if (!w) continue; x += w * (P[j] - R0[j]); y += w * (P[j + 1] - R0[j + 1]); z += w * (P[j + 2] - R0[j + 2]); }
      pos[3 * (nb + i)] = x; pos[3 * (nb + i) + 1] = y; pos[3 * (nb + i) + 2] = z; }
    g.attributes.position.needsUpdate = true; g.computeVertexNormals(); } };
})();

// ---- designs
const alu = new THREE.MeshPhysicalMaterial({ color: 0xa4a7ac, metalness: 1.0, roughness: 0.36 });
const mats = { alu, stainless: new THREE.MeshPhysicalMaterial({ color: 0xcccccf, metalness: 1, roughness: 0.09 }),
  iglide: new THREE.MeshPhysicalMaterial({ color: 0xcc6b08, metalness: 0, roughness: 0.42, clearcoat: 0.2 }) };
const D = [];
for (const d of FILM.designs) {
  const data = await (await fetch(`designs/${d.id}/clips.json` + bust)).json(); const gl = await new GLTFLoader().loadAsync(`designs/${d.id}/exo.glb` + bust);
  gl.scene.updateMatrixWorld(true); const root = new THREE.Group(); root.matrixAutoUpdate = false; scene.add(root); const groups = {};
  const ms = []; gl.scene.traverse(o => { if (o.isMesh) ms.push(o); });
  for (const o of ms) { const nm = (o.name || o.parent?.name || ''), g = nm.split('|')[0], n = nm.toLowerCase();
    o.geometry.applyMatrix4(o.matrixWorld); o.position.set(0, 0, 0); o.rotation.set(0, 0, 0); o.scale.set(1, 1, 1);
    o.material = (n.includes('din 7984') || n.includes('iso 10642') || n.includes('screw') || n.includes('dowel')) ? mats.stainless : (n.includes('igus') || n.includes('iglid') || n.includes('liner') || n.includes('gib')) ? mats.iglide : mats.alu;
    (groups[g] ||= Object.assign(new THREE.Group(), { matrixAutoUpdate: false })).add(o); }
  for (const g of Object.values(groups)) root.add(g);
  D.push({ ...d, data, root, groups });
}
// ---- timeline: shots [{design, clip, f0, f1}] played back to back; designs swap with a shrink/grow about the shoulder
const SH = []; let T = 0; for (const sh of FILM.shots) { const n = sh.f1 - sh.f0 + 1; SH.push({ ...sh, t0: T, n }); T += n; }
const NF = T; $('scrub').max = NF - 1; const XF = FILM.xfade || 10;
const toM4 = (R, t = [0, 0, 0]) => new THREE.Matrix4().set(R[0][0], R[0][1], R[0][2], t[0], R[1][0], R[1][1], R[1][2], t[1], R[2][0], R[2][1], R[2][2], t[2], 0, 0, 0, 1);
const R9 = a => [[a[0], a[1], a[2]], [a[3], a[4], a[5]], [a[6], a[7], a[8]]];
const frameM = lift => new THREE.Matrix4().makeScale(1e-3, 1e-3, 1e-3).multiply(new THREE.Matrix4().makeTranslation(lift[0], lift[1], lift[2]));
const ease = u => u <= 0 ? 0 : u >= 1 ? 1 : u * u * (3 - 2 * u);
function camAt(f) {                                                 // Catmull-Rom through the camera keys
  const K = FILM.camera; let i = 0; while (i < K.length - 2 && K[i + 1].f <= f) i++;
  const a = K[Math.max(0, i - 1)], b = K[i], c = K[Math.min(K.length - 1, i + 1)], d = K[Math.min(K.length - 1, i + 2)];
  const u = Math.min(1, Math.max(0, (f - b.f) / Math.max(1, c.f - b.f)));
  const cr = (p0, p1, p2, p3) => p0.map((_, k) => 0.5 * ((2 * p1[k]) + (-p0[k] + p2[k]) * u + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * u * u + (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * u * u * u));
  return { pos: cr(a.pos, b.pos, c.pos, d.pos), target: cr(a.target, b.target, c.target, d.target), fov: b.fov + (c.fov - b.fov) * u };
}
let f = 0, playing = true, filmCam = true, acc = 0, last = performance.now();
function show() {
  const k = SH.findIndex(x => f >= x.t0 && f < x.t0 + x.n), sh = SH[k], i = f - sh.t0, dz = D[sh.design];
  const fr = dz.data.clips[sh.clip].frames[Math.min(sh.f0 + i, dz.data.clips[sh.clip].frames.length - 1)];
  const [plane, elev, axial, flex, pron] = fr.p, pose = { plane, elev, axial, flex, pron };
  const { segs, lift } = segmentTransforms(L, pose, { girdle: true, scale: ANA.scale }); const M = frameM(lift);
  ANA.update(pose, 0, { girdle: true }); mq.apply(); ANA.setFrame(M);
  // swap: the outgoing design shrinks into the shoulder over the last XF frames, the next grows out of it
  let sc = 1; if (i < XF && k > 0 && SH[k - 1].design !== sh.design) sc = ease(i / XF); if (i >= sh.n - XF && k < SH.length - 1 && SH[k + 1].design !== sh.design) sc = ease((sh.n - 1 - i) / XF);
  for (const [j, dd] of D.entries()) {
    dd.root.visible = j === sh.design && sc > 0.02; if (!dd.root.visible) continue;
    dd.root.matrix.copy(M.clone().multiply(new THREE.Matrix4().makeScale(sc, sc, sc))); dd.root.matrixWorldNeedsUpdate = true;
    for (const g of Object.keys(fr.G)) if (dd.groups[g]) dd.groups[g].matrix.copy(toM4(R9(fr.G[g])));
    if (dd.groups.H) dd.groups.H.matrix.copy(toM4(segs[2].R, segs[2].t)); if (dd.groups.F) dd.groups.F.matrix.copy(toM4(segs[3].R, segs[3].t));
  }
  $('capT').textContent = dz.label; $('capS').textContent = `${dz.sub || ''}  ·  ${dz.data.clips[sh.clip].name}`;
  $('cap').style.opacity = sc > 0.5 ? 1 : 0;
  if (filmCam) { const c = camAt(f); camera.position.set(...c.pos); controls.target.set(...c.target); camera.fov = c.fov; camera.updateProjectionMatrix(); }
  $('scrub').value = f; $('time').textContent = (f / FILM.fps).toFixed(1) + ' s';
}
$('play').onclick = () => { playing = !playing; $('play').textContent = playing ? 'Pause' : 'Play'; };
$('scrub').oninput = e => { playing = false; $('play').textContent = 'Play'; f = +e.target.value; show(); };
$('cam').onclick = e => { filmCam = !filmCam; e.target.setAttribute('aria-pressed', filmCam); e.target.textContent = filmCam ? 'Film camera' : 'Free camera'; };
window.__film = { go: fr => { f = fr; playing = false; show(); }, NF, camera, controls,
  view: (pos, target, fov) => { filmCam = false; camera.position.set(...pos); controls.target.set(...target); if (fov) camera.fov = fov; camera.updateProjectionMatrix(); },   // free close-up camera (world m)
  stop: () => renderer.setAnimationLoop(null), draw: () => { controls.update(); renderer.render(scene, camera); } };   // headless capture (tools/preview_film.mjs): render on demand
show();
renderer.setAnimationLoop(() => {
  const t = performance.now(), dt = Math.min(0.1, (t - last) / 1000); last = t;
  if (playing) { acc += dt * FILM.fps; const n = Math.floor(acc); if (n) { acc -= n; f = (f + n) % NF; show(); } }
  controls.update(); renderer.render(scene, camera);
});
</script>
</body>
</html>
