<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>EXO joint motion preview</title>
<style>
  html, body { margin: 0; height: 100%; background: #e9e8e5; overflow: hidden; }
  canvas { position: absolute; inset: 0; margin: auto; max-width: 100%; max-height: 100%; }
  #s { position: fixed; left: 8px; top: 6px; font: 12px/1.3 Helvetica, Arial, sans-serif; color: #555; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="s">loading</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const Q = new URLSearchParams(location.search);
const RENDER = Q.has('render');
const W = +(Q.get('w') || 960), H = +(Q.get('h') || 540);
let FPS = 30, DUR = 21.2, MOTION = null;
const status = document.getElementById('s');

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.VSMShadowMap;
document.body.appendChild(renderer.domElement);
const fit = () => { const k = Math.min(innerWidth / W, innerHeight / H); renderer.domElement.style.width = W * k + 'px'; renderer.domElement.style.height = H * k + 'px'; };
addEventListener('resize', fit); fit();

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe9e8e5);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
scene.environmentIntensity = 0.85;

const camera = new THREE.PerspectiveCamera(26, W / H, 0.01, 10);

// key light with soft shadow, plus a cool rim from behind
const key = new THREE.DirectionalLight(0xfff6ec, 2.4);
key.castShadow = true;
key.shadow.mapSize.set(4096, 4096);
key.shadow.radius = 9; key.shadow.blurSamples = 24; key.shadow.bias = -0.0002; key.shadow.normalBias = 0.0004;
Object.assign(key.shadow.camera, { left: -0.3, right: 0.3, top: 0.3, bottom: -0.3, near: 0.05, far: 2 });
scene.add(key, key.target);
const rim = new THREE.DirectionalLight(0xdfe8ff, 1.1); scene.add(rim);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(4, 4), new THREE.ShadowMaterial({ opacity: 0.16 }));
ground.rotation.x = -Math.PI / 2; ground.position.y = -0.024; ground.receiveShadow = true; scene.add(ground);

// powder-coat grain: tileable multi-octave value noise -> bump + slight roughness variation
function grain(size = 512) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'), img = g.createImageData(size, size);
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const octave = (cells) => { const L = []; for (let i = 0; i < cells * cells; i++) L.push(rnd());
    return (x, y) => { const fx = x * cells, fy = y * cells, x0 = Math.floor(fx), y0 = Math.floor(fy), tx = fx - x0, ty = fy - y0;
      const s = t => t * t * (3 - 2 * t), v = (i, j) => L[((j % cells + cells) % cells) * cells + ((i % cells + cells) % cells)];
      const a = v(x0, y0) + (v(x0 + 1, y0) - v(x0, y0)) * s(tx), b = v(x0, y0 + 1) + (v(x0 + 1, y0 + 1) - v(x0, y0 + 1)) * s(tx);
      return a + (b - a) * s(ty); }; };
  const o = [[octave(24), 0.45], [octave(64), 0.35], [octave(128), 0.2]];
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    let h = 0; for (const [f, w] of o) h += w * f(x / size, y / size);
    const k = (y * size + x) * 4; img.data[k] = img.data[k + 1] = img.data[k + 2] = h * 255; img.data[k + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8; return t;
}
const tex = grain();
const powder = new THREE.MeshPhysicalMaterial({ color: 0xb9bdc3, metalness: 1, roughness: 0.42 });   // bead-blasted 7075
const steel = new THREE.MeshPhysicalMaterial({ color: 0xbfc2c6, metalness: 1, roughness: 0.26 });
const shieldM = new THREE.MeshPhysicalMaterial({ color: 0xa7aaae, metalness: 1, roughness: 0.38 });
const iglide = new THREE.MeshPhysicalMaterial({ color: 0xdc9f16, metalness: 0, roughness: 0.48, clearcoat: 0.1 });
const titanium = new THREE.MeshPhysicalMaterial({ color: 0x8d9095, metalness: 1, roughness: 0.32 });
const nickel = new THREE.MeshPhysicalMaterial({ color: 0xdad8d3, metalness: 1, roughness: 0.18 });
const MAT = { BOTTOM: powder, MIDDLE: powder, TOP: powder, BEARING: steel, SHIELDS: shieldM, WASHER_LO: iglide,
              WASHER_UP: iglide, MAGNET: nickel, SCREW0: titanium, SCREW1: titanium, SCREW2: titanium };

const clamp01 = t => Math.max(0, Math.min(1, t));
const nodes = {};
fetch('motion.json?t=' + Date.now()).then(r => r.json()).then(m => { MOTION = m; FPS = m.fps; DUR = m.dur;
new GLTFLoader().load('joint.glb?t=' + Date.now(), (g) => {
  g.scene.traverse(o => { if (o.isMesh) { o.material = MAT[o.name] || powder; o.castShadow = o.receiveShadow = true; nodes[o.name] = o; o.userData.y0 = o.position.y; } });
  for (const n of ['SCREW0', 'SCREW1', 'SCREW2']) {                 // pivot each screw on its own axis
    const o = nodes[n]; o.geometry.computeBoundingBox();
    const c = o.geometry.boundingBox.getCenter(new THREE.Vector3());
    o.geometry.translate(-c.x, 0, -c.z); o.position.x += c.x; o.position.z += c.z;
  }
  scene.add(g.scene);
  status.textContent = RENDER ? 'rendering' : '';
  RENDER ? renderAll() : requestAnimationFrame(loop);
}); });

const label = document.createElement('div'); label.style.cssText = 'position:fixed;left:8px;bottom:6px;font:13px Helvetica,Arial;color:#333';
document.body.appendChild(label);
function pose(t) {
  const i = Math.min(MOTION.frames.length - 1, Math.max(0, Math.round(t * FPS))), f = MOTION.frames[i];
  for (const [n, o] of Object.entries(nodes)) {
    const key = n.startsWith('SCREW') ? 'SCREW' : n;
    o.position.y = o.userData.y0 + (f.lift[key] || 0) / 1000;
    o.rotation.y = n.startsWith('SCREW') ? THREE.MathUtils.degToRad(f.spin) : 0;
  }
  nodes.MIDDLE.rotation.y = THREE.MathUtils.degToRad(f.flex);
  const p = f.cam.pos, q = f.cam.target;                          // CAD mm -> glTF m (x, z, -y)
  camera.position.set(p[0] / 1000, p[2] / 1000, -p[1] / 1000);
  const tg = new THREE.Vector3(q[0] / 1000, q[2] / 1000, -q[1] / 1000); camera.lookAt(tg);
  key.position.set(camera.position.x * 0.4 - 0.25, 0.6, camera.position.z * 0.4 + 0.2); key.target.position.copy(tg);
  rim.position.set(-camera.position.x, 0.25, -camera.position.z);
  let txt = ''; for (const [s0, l] of MOTION.labels) if (t >= s0) txt = l;
  label.textContent = `${t.toFixed(1)} s   ${txt}`;
}

function loop(ms) { pose(Q.has('t') ? +Q.get('t') : (ms / 1000) % DUR); renderer.render(scene, camera); requestAnimationFrame(loop); }

async function renderAll() {
  const N = FPS * DUR;
  for (let i = +(Q.get('from') || 0); i < N; i++) {
    pose(i / FPS); renderer.render(scene, camera);
    const c2 = document.createElement('canvas'); c2.width = W; c2.height = H; const g2 = c2.getContext('2d');
    g2.drawImage(renderer.domElement, 0, 0); g2.font = `${Math.round(H / 30)}px Helvetica, Arial`; g2.fillStyle = '#333';
    g2.fillText(label.textContent, Math.round(H / 40), H - Math.round(H / 40));
    const blob = await new Promise(r => c2.toBlob(r, 'image/png'));
    await fetch('/frame?i=' + i, { method: 'POST', body: blob });
    status.textContent = `frame ${i + 1}/${N}`;
  }
  await fetch('/done', { method: 'POST', body: String(N) });
  status.textContent = 'done';
}
window.pose = (t) => { pose(t); renderer.render(scene, camera); };
</script>
</body>
</html>
