<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shoulder D4</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
  html,body{margin:0;height:100%;background:#f2f2f0;font:13px/1.4 "Helvetica Neue",Helvetica,Arial,sans-serif;color:#222}
  model-viewer{width:100%;height:100%;--poster-color:transparent}
  .bar{position:fixed;top:10px;left:12px;display:flex;flex-wrap:wrap;gap:6px}
  .bar button{font:inherit;padding:5px 10px;border:1px solid #c9c9c6;background:#fff;border-radius:6px;cursor:pointer}
  .bar button[aria-pressed="true"]{background:#222;color:#fff;border-color:#222}
</style>
</head>
<body>
<model-viewer id="mv" camera-controls touch-action="pan-y" shadow-intensity="0.6" exposure="1.0" environment-image="neutral"
  camera-orbit="35deg 62deg auto" interaction-prompt="none" min-camera-orbit="auto auto 0.02m"></model-viewer>
<div class="bar">
  <button data-src="shoulder_d4.glb" aria-pressed="true">Shoulder D4</button>
  <button data-src="ref_link.glb" aria-pressed="false">Reference scissor link</button>
</div>
<script type="module">
  const mv = document.getElementById('mv'); const bust = Date.now();
  const q = new URLSearchParams(location.search).get('m');
  mv.src = (q || 'shoulder_d4.glb') + '?t=' + bust;
  for (const b of document.querySelectorAll('[data-src]')) {
    if (q) b.setAttribute('aria-pressed', b.dataset.src === q);
    b.onclick = () => { for (const o of document.querySelectorAll('[data-src]')) o.setAttribute('aria-pressed', o === b); mv.src = b.dataset.src + '?t=' + Date.now(); };
  }
</script>
</body>
</html>
